name: Markdown checks

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  markdown:
    name: Lint and format Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Markdown formatting
        run: npx --yes prettier@3.6.2 --check "**/*.md" ".github/**/*.md"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" ".github/**/*.md"
